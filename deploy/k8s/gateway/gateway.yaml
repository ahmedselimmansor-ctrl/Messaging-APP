# GKE Gateway API — the HTTPS entrypoint.
#
# Gateway API rather than Ingress: it separates the infrastructure concern
# (the Gateway, owned by the platform) from the routing concern (HTTPRoute,
# owned by each service), and it can express things Ingress cannot, such as
# header-based routing and weighted backends.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: messaging-gateway
  namespace: messaging
  annotations:
    # Bind the pre-created global anycast address rather than letting the
    # controller allocate one, so the DNS record Terraform wrote stays valid.
    networking.gke.io/addresses: messaging-ENV-api-ip
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "api.DOMAIN"
      tls:
        mode: Terminate
        options:
          networking.gke.io/pre-shared-certs: messaging-ENV-api-cert
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      hostname: "api.DOMAIN"
      allowedRoutes:
        namespaces:
          from: Same
---
# Everything on port 80 redirects. Serving any content over plain HTTP would
# let a network attacker strip TLS on the first request.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: messaging
spec:
  parentRefs:
    - name: messaging-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-routes
  namespace: messaging
spec:
  parentRefs:
    - name: messaging-gateway
      sectionName: https
  rules:
    # The WebSocket transport. First, because a prefix match on /v1 would
    # otherwise swallow it.
    - matches:
        - path:
            type: PathPrefix
            value: /mtproto
      backendRefs:
        - name: realtime-gateway
          port: 80
      timeouts:
        # An hour: this is a long-lived connection, not a request.
        request: 3600s

    - matches:
        - path: { type: PathPrefix, value: /v1/auth }
        - path: { type: PathPrefix, value: /v1/me }
        - path: { type: PathPrefix, value: /.well-known }
      backendRefs:
        - name: auth-service
          port: 80

    - matches:
        - path: { type: PathPrefix, value: /v1/uploads }
        - path: { type: PathPrefix, value: /v1/media }
      backendRefs:
        - name: media-service
          port: 80

    - matches:
        - path: { type: PathPrefix, value: /v1 }
      backendRefs:
        - name: chat-service
          port: 80
      timeouts:
        request: 30s

    # An explicit 404 for anything unmatched, so an unknown path does not
    # reach a service that then has to decide what to do with it.
    - matches:
        - path: { type: PathPrefix, value: / }
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Cache-Control, value: "no-store" }
      backendRefs:
        - name: chat-service
          port: 80
---
# Attaches the Cloud Armor policy and the health check to the Gateway's
# backends. GCPBackendPolicy is how a Gateway API resource reaches the
# GCP-specific settings that have no upstream equivalent.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: api-backend-policy
  namespace: messaging
spec:
  default:
    securityPolicy: messaging-ENV-api-armor
    timeoutSec: 30
    connectionDraining:
      drainingTimeoutSec: 60
    logging:
      enabled: true
      sampleRate: 100000
  targetRef:
    group: ""
    kind: Service
    name: chat-service
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: realtime-backend-policy
  namespace: messaging
spec:
  default:
    securityPolicy: messaging-ENV-api-armor
    # An hour, matching the HTTPRoute timeout: a WebSocket that the backend
    # service severs at 30s is a WebSocket that reconnects 120 times an hour.
    timeoutSec: 3600
    connectionDraining:
      drainingTimeoutSec: 120
  targetRef:
    group: ""
    kind: Service
    name: realtime-gateway
