apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: messaging
  labels: { app: search-service, tier: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: search-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: search-service, tier: api }
      annotations:
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
    spec:
      serviceAccountName: search-service
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: search-service }
      nodeSelector: { workload: stateless }
      containers:
        - name: search-service
          image: IMAGE_REPOSITORY/search-service:latest
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: platform-config }
          env:
            - { name: SERVICE_NAME, value: search-service }
            - name: HOSTNAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: GOMEMLIMIT, value: "430MiB" }
            # A distinct Elasticsearch user from the indexer's. This one holds
            # read privileges only, so a compromise of the query path cannot
            # rewrite or delete the index it searches.
            - { name: ELASTICSEARCH_USERNAME, value: "search" }
            - { name: ELASTICSEARCH_PASSWORD_FILE, value: /var/secrets/elasticsearch-password }
          startupProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 15
            failureThreshold: 5
          lifecycle:
            preStop: { exec: { command: ["/bin/sleep", "5"] } }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: secrets, mountPath: /var/secrets, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: search-secrets }
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: messaging
  labels: { app: search-service }
spec:
  selector: { app: search-service }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: admin, port: 9090, targetPort: admin }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: search-service, namespace: messaging }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: search-service }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: search-service, namespace: messaging }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: search-service }
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata: { name: search-service, namespace: messaging }
spec:
  selector:
    matchLabels: { app: search-service }
  endpoints:
    - { port: admin, path: /metrics, interval: 30s }
