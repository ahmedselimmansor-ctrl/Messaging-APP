# One Kubernetes ServiceAccount per workload, each annotated with the Google
# service account it impersonates through Workload Identity.
#
# The annotation value must exactly match the GSA email Terraform created, and
# the Terraform side must have bound
# serviceAccount:PROJECT.svc.id.goog[messaging/NAME] as a workloadIdentityUser
# on that GSA. Both halves are required; getting one wrong produces a runtime
# permission error that names neither account and is genuinely painful to
# debug. `terraform output workload_service_accounts` prints the exact values.
#
# The GSA emails below carry a PROJECT_ID placeholder that the kustomize
# overlays replace per environment.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: messaging
  annotations:
    iam.gke.io/gcp-service-account: ENV-auth-service@PROJECT_ID.iam.gserviceaccount.com
# Nothing in this platform talks to the Kubernetes API from application code,
# so no pod needs a projected API token. Mounting one anyway is a free
# privilege escalation path if a container is compromised.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chat-service
  namespace: messaging
  annotations:
    iam.gke.io/gcp-service-account: ENV-chat-service@PROJECT_ID.iam.gserviceaccount.com
automountServiceAccountToken: false
---
