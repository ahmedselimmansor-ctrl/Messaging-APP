apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  namespace: messaging
  labels: { app: indexer, tier: consumer }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: indexer }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 1 }
  template:
    metadata:
      labels: { app: indexer, tier: consumer }
      annotations:
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
    spec:
      serviceAccountName: indexer
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: indexer }
      nodeSelector: { workload: stateless }
      containers:
        - name: indexer
          image: IMAGE_REPOSITORY/indexer:latest
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: platform-config }
          env:
            - { name: SERVICE_NAME, value: indexer }
            - name: HOSTNAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: GOMEMLIMIT, value: "870MiB" }
            - { name: ELASTICSEARCH_PASSWORD_FILE, value: /var/secrets/elasticsearch-password }
            # A username is not a credential; only the password is held in
            # Secret Manager.
            - { name: ELASTICSEARCH_USERNAME, value: "indexer" }
          startupProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 15
            failureThreshold: 5
          lifecycle:
            preStop: { exec: { command: ["/bin/sleep", "5"] } }
          resources:
            requests: { cpu: 300m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: secrets, mountPath: /var/secrets, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: search-secrets }
---
apiVersion: v1
kind: Service
metadata:
  name: indexer
  namespace: messaging
  labels: { app: indexer }
spec:
  clusterIP: None
  selector: { app: indexer }
  ports:
    - { name: admin, port: 9090, targetPort: admin }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: indexer, namespace: messaging }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: indexer }
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: indexer, namespace: messaging }
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: indexer }
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata: { name: indexer, namespace: messaging }
spec:
  selector:
    matchLabels: { app: indexer }
  endpoints:
    - { port: admin, path: /metrics, interval: 30s }
