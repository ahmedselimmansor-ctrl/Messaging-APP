apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The base is deliberately not deployable on its own: it carries PROJECT_ID,
# ENV and IMAGE_REPOSITORY placeholders that only an overlay can fill. That is
# what stops someone applying the base by accident and getting a half-configured
# environment.

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - config.yaml
  - networkpolicy.yaml
  - auth-service.yaml
  - chat-service.yaml
  - realtime-gateway.yaml
  - presence-service.yaml
  - media-service.yaml
  - notification-service.yaml
  - persister.yaml
  - pusher.yaml
  - indexer.yaml
  - mediaproc.yaml
  - auditor.yaml
  - search-service.yaml
  - call-service.yaml
  - admin-service.yaml
  - coturn.yaml
  - ../mesh
  - ../gateway

labels:
  - pairs:
      app.kubernetes.io/part-of: messaging
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
